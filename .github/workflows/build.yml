name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.9.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "Keystore decoded successfully"
          ls -la keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleCoreRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/core/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No release APK found"
            exit 1
          fi
          echo "APK: $APK"
          unzip -l "$APK" | grep -q "META-INF/" || { echo "ERROR: APK has no signature (META-INF/ missing)"; exit 1; }
          echo "APK signature verified"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-${{ inputs.version }}
          path: app/build/outputs/apk/core/release/*.apk
          retention-days: 90

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ inputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          # Write multi-line output using delimiter
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Messages ${{ inputs.version }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: app/build/outputs/apk/core/release/*.apk
          make_latest: true
